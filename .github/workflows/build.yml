name: Build Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build macOS app
        run: bash scripts/build_macos.sh
      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: dingge-screenshot-macos
          path: |
            dist/定格截图-macOS.zip
            dist/定格截图-macOS.dmg

  windows:
    name: Windows app
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Windows app
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: dingge-screenshot-windows
          path: |
            dist/定格截图-Windows.zip
            dist/定格截图/定格截图.exe

  release:
    name: Publish release
    needs:
      - macos
      - windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: 定格截图 ${{ github.ref_name }}
          body: |
            ## 定格截图

            ### 功能
            - 支持全屏截图、自定义区域截图
            - 支持已打开浏览器页面批量截图
            - 浏览器截图会自动生成 HTML 查看页面
            - 支持定时间隔截图
            - 支持保存目录选择和打开
            - 支持 macOS 和 Windows

            ### 下载
            - macOS 用户下载 `定格截图-macOS.dmg` 或 `定格截图-macOS.zip`
            - Windows 用户下载 `定格截图.exe` 或 `定格截图-Windows.zip`
          append_body: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
