name: Build Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build macOS app
        run: bash scripts/build_macos.sh
      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: dingge-screenshot-macos
          path: |
            dist/定格截图-v*-macOS.zip
            dist/定格截图-v*-macOS.dmg

  windows:
    name: Windows app
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Windows app
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: dingge-screenshot-windows
          path: |
            dist/定格截图-v*-Windows.zip
            dist/定格截图-v*-Windows.exe

  release:
    name: Publish release
    needs:
      - macos
      - windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: 定格截图 ${{ github.ref_name }}
          body: |
            ## 定格截图 ${{ github.ref_name }}

            ### 本次更新
            - 修复 macOS 下全局快捷键可能导致软件闪退的问题
            - macOS 快捷键改为系统原生全局快捷键，软件缩到菜单栏后也可以触发单次截图
            - 修复 `Command + Shift + 1` 被识别成 `Command + Shift + !` 的问题
            - 优化快捷键设置页，点击快捷键框即可重新设置
            - 发布包文件名加入版本号，下载时更容易区分版本

            ### 功能
            - 支持全屏截图、自定义区域截图
            - 支持已打开浏览器页面批量截图
            - 浏览器截图会自动生成 HTML 查看页面
            - 支持定时间隔截图
            - 支持单次截图快捷键
            - 支持保存目录选择和打开
            - 支持 macOS 和 Windows

            ### 下载
            - macOS 用户下载 `定格截图-${{ github.ref_name }}-macOS.dmg` 或 `定格截图-${{ github.ref_name }}-macOS.zip`
            - Windows 用户下载 `定格截图-${{ github.ref_name }}-Windows.exe` 或 `定格截图-${{ github.ref_name }}-Windows.zip`
          append_body: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
